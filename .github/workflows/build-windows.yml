name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: |
          pyinstaller --noconfirm --onefile --console --name OOZWorker --distpath assets/ooz --workpath build/ooz --specpath assets/ooz assets/ooz/worker.py
          pyinstaller --noconfirm --clean MHWLayerStudio.spec
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: MHWI-Layer-Studio-Windows
          path: installer-output/*.exe
